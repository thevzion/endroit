name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  static-workplace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run example:reset
      - run: bun run example:fresh:preview
      - run: bun src/cli.ts check --mount examples/smallest/world --json
      - run: bun src/cli.ts check --mount examples/rich/world --json
      - run: bun src/cli.ts check --mount examples/field-lab/world --json
      - run: bun src/cli.ts check --mount examples/flappy/world --json
      - run: git diff --exit-code
