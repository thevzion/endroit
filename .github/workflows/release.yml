name: npm release

run-name: npm release from ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  NPM_VERSION: 11.5.1
  RELEASE_ARTIFACT: endroit-0.8-release-candidate

jobs:
  qualify:
    name: qualify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the exact public main commit
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$GITHUB_SHA" = "$remote_main"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run conformance
      - run: npm run check:providers
      - run: npm run check:pack

  package:
    name: package once
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm run check:lab
      - name: Build, probe public schemas and dry-run the release artifact
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/npm-release"
          node scripts/release-packages.mjs "$release_dir"
          node scripts/release-publish.mjs "$release_dir/manifest.json" --dry-run
          echo "- commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node -e "for (const p of require('$release_dir/manifest.json').packages) console.log('- ' + p.name + '@' + p.version + ': ' + p.integrity)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish npm
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@endroit/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/npm-release
      - name: Revalidate the qualified artifact and registry
        run: node scripts/release-publish.mjs "$RUNNER_TEMP/npm-release/manifest.json"

  smoke-next:
    name: smoke npm next
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Recreate and inspect a Home from npm next
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tagged=""
          for attempt in $(seq 1 36); do
            tagged="$(npm view @endroit/cli dist-tags.next --json 2>/dev/null | tr -d '\"' || true)"
            test "$tagged" = "$version" && break
            sleep 5
          done
          test "$tagged" = "$version"
          smoke_root="$RUNNER_TEMP/endroit-next-smoke"
          npm exec --yes --package="@endroit/cli@$version" -- endroit create "$smoke_root" --desk tracked --no-interactive --yes
          cd "$smoke_root"
          node ./endroit.mjs doctor --json | node -e "let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{if(JSON.parse(s).status!=='ready')process.exit(1)})"
          node ./endroit.mjs hygiene maintain --json | node -e "let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{if(JSON.parse(s).readOnly!==true)process.exit(1)})"
